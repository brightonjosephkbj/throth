name: Build Throth v1.0 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Android ARM64 linker
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "$TOOLCHAIN" >> $GITHUB_PATH
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Build Linux x86_64
        run: cargo build --release --bin throth

      - name: Build Android ARM64 library
        run: |
          cargo build --release --target aarch64-linux-android --lib
          file target/aarch64-linux-android/release/libthroth.so
          readelf -h target/aarch64-linux-android/release/libthroth.so
          readelf -d target/aarch64-linux-android/release/libthroth.so

      - name: Package Linux binary
        run: |
          mkdir -p dist/linux
          cp target/release/throth dist/linux/
          tar -czf throth-v1.0-linux-x86_64.tar.gz -C dist/linux throth

      - name: Package Android ARM64 binary and library
        run: |
          mkdir -p dist/android
          cp target/aarch64-linux-android/release/throth dist/android/ 2>/dev/null || true
          cp target/aarch64-linux-android/release/libthroth.so dist/android/
          tar -czf throth-v1.0-android-arm64.tar.gz -C dist/android throth 2>/dev/null || true
          tar -czf throth-android-arm64-library.tar.gz -C dist/android libthroth.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: throth-linux-x86_64
          path: throth-v1.0-linux-x86_64.tar.gz

      - name: Upload Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: throth-android-arm64
          path: throth-v1.0-android-arm64.tar.gz

      - name: Upload Android ARM64 Library artifact
        uses: actions/upload-artifact@v4
        with:
          name: throth-android-arm64-library
          path: throth-android-arm64-library.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Throth v1.0
          make_latest: true
          overwrite_files: true
          files: |
            throth-v1.0-linux-x86_64.tar.gz
            throth-v1.0-android-arm64.tar.gz
            throth-android-arm64-library.tar.gz
