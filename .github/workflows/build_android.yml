name: Build Android libthroth

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build ARM64 libthroth.so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK linker
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build cdylib
        run: |
          cargo build --release --target aarch64-linux-android --lib

      - name: Verify JNI export
        run: |
          LIB=target/aarch64-linux-android/release/libthroth.so
          SYMBOL=Java_expo_modules_throthmedia_ThrothModule_nativeSearch
          if ! readelf --dyn-syms --wide "$LIB" | grep -Fq "$SYMBOL"; then
            echo "ERROR: Required JNI symbol is missing: $SYMBOL"
            exit 1
          fi
          echo "Verified JNI export: $SYMBOL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libthroth-aarch64
          path: target/aarch64-linux-android/release/libthroth.so
