[package]
name = "throth"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
urlencoding = "2.1"
regex = "1.13.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
scraper = "0.29.0"
serde_json = "1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
url = "2.5.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
